version: 1
generated_from: content/docs (English pages; translations reuse the same image files)
demo_server:
  url: https://release-demo-open.msupply.org
  user: Documentation
  note: Password held by the docs team; not stored in this repo.
  server_version: 2.21.01
  frontend: NEW frontend (no MUI, CSS modules, native <dialog>/popover). Remote reports 2.21.01; central
    client build v0.0.368-rc0. Verified 2026-09-10/11.
  warning: The demo serves a different client from the one every committed screenshot was taken with.
    Old-style URLs such as /distribution/outbound-shipment do not resolve.
  url_scheme: /{storeId}/<route>  e.g. /A87768605209F64BBC4CD0B539F8B63D/dispensary/prescription
  stores:
    STR-BDR-DST:
      name: Bedrock District Store
      id: 9721DA7B86CDDB4F96CECDF0E1D5D4E5
      dispensary: false
    STR-BDR-HCC:
      name: Bedrock Creek Health Centre
      id: A87768605209F64BBC4CD0B539F8B63D
      dispensary: true
    STR-BDR-EPI:
      name: Bedrock EPI Store
      id: null
      dispensary: null
  central_url: https://release-demo-open.msupply.org:8888
  central_store:
    name: Central Medical Store
    id: 3C134746F7D91E439223AC244BE7F633
route_notes:
  '*': Shared chrome - the shot is of a control/region that is the same on many pages. Pick any convenient
    route.
  '-': Not an Open mSupply screen at all (photo, diagram, OS dialog, legacy mSupply desktop).
  dashboard: mSupply Dashboard (separate product, not the Open mSupply web client).
  android: The Open mSupply Android app.
  '{id} / {itemId}': A record id - the capture script must create or select a suitable record first.
regions:
  full: 'The whole app window: nav drawer (or collapsed icon rail) + app bar + content + footer.'
  content: Main content pane only - breadcrumb bar down to and including the footer/status bar. Nav drawer
    excluded.
  content-top: 'Top band of the content pane: breadcrumb bar, toolbar buttons and filter bar. Roughly
    the first 25% of the pane.'
  content-part: An arbitrary block inside the content pane (a card, a tab body, a banner, a group of table
    rows).
  detail-header: The detail-view header block above the tabs (customer/supplier/patient name, reference,
    dates).
  tab: The tab strip of a detail view.
  footer: The fixed footer/status bar, including the status crumbs and Confirm split-button.
  nav: The navigation drawer, or a vertical slice of it.
  nav-part: A single nav item or badge within the drawer.
  panel: The right-hand detail ("More") panel.
  panel-part: One section of the right-hand detail panel.
  modal: A dialog, captured as the dialog box (usually with its dimmed backdrop).
  modal-part: One section inside a dialog.
  menu: An open dropdown / popover / split-button menu.
  toast: A snackbar or notification banner.
  control: A close-up of a single button, field or small control.
  icon: An icon asset used inline in prose, not a screen capture.
  external: Not the Open mSupply web client - legacy mSupply desktop, the Android app, mSupply Dashboard,
    an OS dialog, a photo or a diagram.
  filter-bar: Search / filter bar above a table (list pages and detail line tables).
