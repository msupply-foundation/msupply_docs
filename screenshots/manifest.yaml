region_selectors:
  _note: Verified against the live demo (remote 2026-09-10, central 2026-09-11) at 1440x900. Clip a Playwright
    locator to the selector given. CSS-module class names carry a build hash, so structural selectors
    prefix-match; where possible they anchor on a data-testid they contain instead. These match src/regions.js
    in the open-msupply-screenshot tool, which is the source of truth.
  full:
    selector: null
    how: page.screenshot() at a fixed viewport.
    verified: true
  content:
    selector: div[class^="_main_"]:has(> div[class^="_content_"])
    how: Content pane plus app footer, drawer excluded.
    verified: true
  content-top:
    selector: div[class^="_page_"] > div[class^="_main_"] > header
    how: 'Breadcrumb + action buttons (+ detail toolbar and tab strip on detail views). NOT the table
      filter bar - see filter-bar. Scoped to the page column: a bare header[class^="_header_"] also matches
      the command palette''s hidden sr-only header.'
    verified: true
  filter-bar:
    selector: div[class^="_toolbar_"]:has([data-testid="filters-menu"])
    how: Search/filter bar above a table. In the new UI this sits in the body below the header, not in
      the header band as the old UI did.
    verified: true
  content-part:
    selector: null
    how: Per-shot locator. Most list/table blocks are reachable via [data-testid^="header-"] / [data-testid="table-row"]
      / [data-testid^="cell-"].
    verified: false
  detail-header:
    selector: div[class^="_page_"] > div[class^="_main_"] > header div[class^="_toolbar_"]
    how: Field row (Customer name, Reference) inside the detail header. DETAIL views only; a list route
      has none.
    verified: true
  tab:
    selector: div[class^="_list_"]:has(> [data-testid^="tab-"])
    how: Tab strip; individual tabs are [data-testid^="tab-"]. Detail views only.
    verified: true
  footer:
    selector: div[class^="_footer_"]:has([data-testid="status-crumbs"])
    how: 'DETAIL footer: on-hold-button, status-crumbs, status-change split button. Detail views only.'
    verified: true
  footer-app:
    selector: '[data-testid="app-footer"]'
    how: 'APP footer: store selector, user menu, sync. Split out from `footer` - see region_notes.'
    verified: true
  nav:
    selector: '[data-testid="drawer"]'
    how: Navigation drawer.
    verified: true
  nav-part:
    selector: '[data-testid^="nav-"]'
    how: A single nav item.
    verified: true
  panel:
    selector: '[data-testid="detail-panel"]'
    how: Right-hand panel; open it with [data-testid="open-detail-panel-button"].
    verified: true
  panel-part:
    selector: '[data-testid^="panel-section-"]'
    how: One section of the right-hand panel.
    verified: true
  modal:
    selector: dialog[open]
    how: 'All modals are native <dialog>. Buttons: [data-testid="dialog-button-ok"] / "-cancel".'
    verified: true
  modal-part:
    selector: null
    how: Per-shot locator inside dialog[open].
    verified: false
  menu:
    selector: '[role="menu"], [popover]:popover-open'
    how: Dropdowns render as [role="menu"]; filter/colour/nav-flyout panels use the popover API.
    verified: true
  toast:
    selector: null
    how: Not observed during the walk - no toast container exists in the DOM until one fires. Needs confirming.
    verified: false
  control:
    selector: null
    how: Per-shot locator; most toolbar buttons already have a data-testid.
    verified: false
  icon:
    selector: null
    how: Skip - not a screen capture.
    verified: true
  external:
    selector: null
    how: Skip - not the web client.
    verified: true
route_availability:
  _note: Probed on the remote demo (2026-09-10) and the central server at :8888 (2026-09-11). Prefix every
    route with /{storeId}.
  available:
  - dashboard
  - distribution/outbound-shipment
  - distribution/customer-requisition
  - distribution/customer-return
  - distribution/customers
  - replenishment/inbound-shipment
  - replenishment/internal-order
  - replenishment/supplier-return
  - replenishment/suppliers
  - replenishment/r-and-r-forms
  - inventory/stock
  - inventory/stocktakes
  - inventory/locations
  - inventory/stock-movement
  - catalogue/items
  - catalogue/assets
  - catalogue/master-lists
  - cold-chain/equipment
  - cold-chain/monitoring
  - cold-chain/sensors
  - reports
  - settings
  - help
  dispensary_store_only:
    note: Only in a store with dispensary mode on - use Bedrock Creek Health Centre.
    routes:
    - dispensary/patients
    - dispensary/prescription
    - dispensary/encounter
    - dispensary/clinicians
  not_found:
    note: Not a route in this client, or needs a record id.
    routes:
      catalogue/assets/log-reasons: Not found on remote OR central, and the Assets page has no Manage-log-reasons
        button - the feature appears to have no route in the new client; 5 shots may document a removed
        feature
      replenishment/inbound-shipment-external: wrong slug - the real route is replenishment/inbound-shipment/external
        (central, procurement)
      dispensary/vaccine-card: needs a patient/programme id; reached from a patient
      dispensary/contact-trace: needs a contact id
      sync: not a route - sync lives in the app footer ([data-testid="footer-sync"], "-now", "-details")
  central_server_only:
    note: Verified present on release-demo-open.msupply.org:8888; redirect to Dashboard on a remote site.
    routes:
    - manage/stores
    - manage/global-preferences
    - manage/campaigns
    - manage/indicators-demographics
    - manage/custom-fields
    - manage/sites
    - manage/plugins
    - manage/help-documents
    - manage/sync-message
    - manage/reports
    - manage/equipment
    - programs/immunisations
    - replenishment/purchase-order
    - replenishment/inbound-shipment/external
region_notes:
  footer: The catalogue uses one `footer` region for two different bars. Shots described as "Status crumb
    ..." are the DETAIL footer (div[class^="_footer_mrv2s"]); shots described as "Footer with Current
    Store / User / Language", "Footer username area", "Footer with store Edit link" and "App footer with
    Central server identifier chip" are the APP footer ([data-testid="app-footer"]). Split these when
    wiring up capture.
  responsive: The client collapses the drawer to a hamburger below roughly 1000px wide and collapses toolbar
    buttons to icons. Capture at >=1440px or the layout will not match any of the catalogued shots.
